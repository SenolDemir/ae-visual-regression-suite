name: Update Visual Baselines

on:
  workflow_dispatch:

permissions:
  contents: write  

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Regenerate baseline snapshots
        run: npx playwright test --update-snapshots
        continue-on-error: true   # to prevent test failure from blocking the commit step

      - name: Commit updated baselines
        if: always()   # run even if the previous step reported failure
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update visual regression baselines"
          file_pattern: "**/*-snapshots/**/*.png"
          disable_globbing: true